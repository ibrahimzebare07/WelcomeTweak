name: Build Tweak
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Theos
    
      - name: Build Package
        run: make package
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IbrahimZebareTweak
          path: packages/*.deb
